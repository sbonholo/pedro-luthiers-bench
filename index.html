<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luthier's Bench</title>
<meta name="description" content="Build a cello from two billets of wood to its first note.">
<meta name="theme-color" content="#16110d">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (latin subsets from @fontsource, OFL-1.1; see fonts/LICENSE.txt). System fonts are the fallback. */
@font-face{font-family:"Marcellus";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/marcellus-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/instrument-sans-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: a lamp-lit workbench. Step rail | the bench (canvas) | the luthier's notebook. One committed dark, warm look. */
:root{
  --bench:#16110d; --panel:#211912; --panel-2:#2b2118; --line:#3b2f23;
  --ink:#f2e8d7; --muted:#ab9a82; --brass:#d6a85c; --brass-deep:#a97c38;
  --ok:#97bb8c; --warn:#e5a35c; --bad:#dc6852;
  --paper:#eadcbd; --paper-ink:#3a2615;
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bench);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.app{max-width:1460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font:400 30px/1.05 var(--f-display);letter-spacing:.02em;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.meta{display:flex;align-items:center;gap:12px}
.meter{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.meter b{color:var(--brass);font-weight:500}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:9px 14px;border-radius:999px;font:500 13.5px var(--f-body);cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--brass-deep)}
.btn:focus-visible,.sw:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1d140b;font-weight:600}
.btn.primary:hover{background:#e3b86c}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:12.5px}
.main{display:grid;grid-template-columns:196px minmax(0,1fr) 340px;gap:22px;align-items:start}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;color:var(--muted);font-size:14px}
.rail .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 11.5px var(--f-mono);border:1px solid var(--line);color:var(--muted)}
.rail .sc{font:500 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail li.cur{background:var(--panel);color:var(--ink)}
.rail li.cur .n{border-color:var(--brass);color:var(--brass)}
.rail li.done{color:var(--ink)}
.rail li.done .n{background:var(--brass);border-color:var(--brass);color:#1d140b}
.stage{display:flex;justify-content:center;min-width:0}
#c{display:block;width:100%;max-width:max(320px,calc((100vh - 120px)*.8));max-width:max(320px,calc((100dvh - 120px)*.8));aspect-ratio:4/5;height:auto;touch-action:none;border-radius:14px;background:#120d0a;cursor:crosshair;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
.notebook{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:14px;min-width:0}
.eyebrow{margin:0;font:500 11.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.notebook h2{margin:-6px 0 0;font:400 29px/1.1 var(--f-display);text-wrap:balance}
.lead{margin:0;color:var(--ink);opacity:.92}
.how{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.how li::marker{color:var(--brass-deep)}
.reads{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px;background:var(--bench);border:1px solid var(--line);border-radius:10px}
.reads:empty{display:none}
.ro{min-width:0}
.ro.wide{grid-column:1/-1}
.ro dt{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ro dd{margin:2px 0 0;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.ro.wide dd{font:400 13.5px/1.45 var(--f-body);color:var(--ink)}
.ro.ok dd{color:var(--ok)} .ro.warn dd{color:var(--warn)} .ro.bad dd{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{margin:0;min-height:1.5em;font-size:13.5px;color:var(--muted)}
.toast.warn{color:var(--warn)} .toast.bad{color:var(--bad)} .toast.ok{color:var(--ok)}
.extra:empty{display:none}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{appearance:none;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bench);color:var(--ink);cursor:pointer;text-align:left;font:500 13px var(--f-body)}
.sw i{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25)}
.sw[aria-pressed="true"]{border-color:var(--brass);background:var(--panel-2)}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.label-card{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:16px 18px;text-align:center;box-shadow:inset 0 0 30px rgba(120,80,30,.25);font-family:var(--f-display)}
.label-card .l1{font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.label-card .l2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;opacity:.8}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bench);color:var(--ink);font:500 15px var(--f-body)}
.grade{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bench)}
.grade b{font:400 22px var(--f-display);color:var(--brass)}
.grade span{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fine{margin:0;font-size:12.5px;color:var(--muted)}
@media (max-width:1180px){.main{grid-template-columns:168px minmax(0,1fr) 300px;gap:16px}}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{overflow-x:auto;margin-inline:-4px;padding-bottom:4px}
  .rail ol{flex-direction:row;width:max-content;gap:4px}
  .rail li{grid-template-columns:24px auto;gap:6px;padding:6px 8px;font-size:13px}
  .rail .sc{display:none}
  .notebook{position:static}
}
/* phones and touch screens: 44px tap targets, no text under 12px, 16px inputs (no iOS focus zoom) */
@media (max-width:980px),(pointer:coarse){
  .btn,.btn.small,.sw{min-height:44px}
  .btn.small{padding:6px 14px}
  .field input{min-height:44px;font-size:16px}
}
@media (max-width:600px){
  .eyebrow,.meter,.rail .n,.ro dt,.field label{font-size:12px}
  .fine,.tbl{font-size:13px}
}
.resume{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,7,5,.74)}
.resume .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.resume h2{margin:0;font:400 26px/1.15 var(--f-display);text-wrap:balance}
.resume p{margin:0;color:var(--muted);font-size:14px}
.resume .actions .btn{min-height:44px}
.errtoast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--bad);background:var(--panel-2);color:var(--ink);font:500 14px var(--f-body);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Friendly crash toast: any uncaught error or rejected promise offers a reload. */
(()=>{let shown=false;
  function show(){if(shown||!document.body)return;shown=true;const b=document.createElement('button');b.type='button';b.className='errtoast';b.setAttribute('role','alert');
    b.textContent='Something went wrong \u2013 tap to reload';b.addEventListener('click',()=>location.reload());document.body.appendChild(b);}
  window.__lbErr=show;
  window.onerror=function(msg){if(/ResizeObserver loop/i.test(String(msg)))return false;show();return false;};
  window.addEventListener('unhandledrejection',()=>show());})();
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Luthier's Bench</h1>
      <p>Build a cello from two billets of wood to its first note.</p>
    </div>
    <div class="meta">
      <span class="meter">Step <b id="mStep">1</b> / 12 · Score <b id="mScore">—</b></span>
      <button class="btn small" id="btnSound" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" aria-label="Build steps"><ol id="rail"></ol></nav>
    <div class="stage"><canvas id="c" width="800" height="1000" aria-label="Workbench"></canvas></div>
    <section class="notebook" aria-live="polite">
      <p class="eyebrow" id="eyebrow">Step 1 of 12</p>
      <h2 id="stTitle">Choose the tonewood</h2>
      <p class="lead" id="stLead"></p>
      <ul class="how" id="stHow"></ul>
      <div class="extra" id="extra"></div>
      <dl class="reads" id="reads"></dl>
      <div class="actions">
        <button class="btn primary" id="btnNext" type="button" disabled>Continue</button>
        <button class="btn" id="btnRedo" type="button">Redo step</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </section>
  </div>
</div>
<div class="resume" id="resume" role="dialog" aria-modal="true" aria-labelledby="resumeTitle" hidden>
  <div class="card">
    <p class="eyebrow">Welcome back</p>
    <h2 id="resumeTitle">Your cello is waiting on the bench</h2>
    <p id="resumeStep"></p>
    <div class="actions">
      <button class="btn primary" id="btnResume" type="button">Continue</button>
      <button class="btn" id="btnFresh" type="button">Start a new cello</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================= canvas + basics ================= */
const W=800,H=1000;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let CS=1;
/* ================= on-demand rendering =================
   The canvas is only redrawn when something changed (input, UI, resize, fonts) or while a stage
   reports active animation (busy). Expensive static art is cached in offscreen layers. */
let rafId=0,dirty=true,running=false,hidden=!!document.hidden,last=0;
function invalidate(){dirty=true;if(running&&!rafId&&!hidden){last=performance.now();rafId=requestAnimationFrame(frame);}}
const LAYERS=new Map(),SPR=new Map();
function dropCaches(){LAYERS.clear();SPR.clear();}
function lru(m,key,max,make){let c=m.get(key);if(c)m.delete(key);else{while(m.size>=max)m.delete(m.keys().next().value);c=make();}m.set(key,c);return c;}
function offscreen(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const main=ctx;ctx=c.getContext('2d');ctx.setTransform(CS,0,0,CS,0,0);try{fn();}finally{ctx=main;}return c;}
/* full-canvas layer drawn with the base transform; blitted 1:1 so it is pixel-identical to drawing live */
function layer(key,fn){const c=lru(LAYERS,key+'|'+cv.width,4,()=>offscreen(cv.width,cv.height,fn));ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(c,0,0);ctx.restore();}
function fit(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(240,Math.round((r.width||800)*dpr));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*1.25);dropCaches();CS=cv.width/W;invalidate();}CS=cv.width/W;}
if('ResizeObserver' in window)new ResizeObserver(fit).observe(cv);
window.addEventListener('resize',fit);fit();
const $=s=>document.querySelector(s);
const F_D='"Marcellus", Georgia, serif',F_M='"IBM Plex Mono", ui-monospace, Menlo, monospace',F_B='"Instrument Sans", system-ui, sans-serif';
const COL={brass:'#d6a85c',brassDeep:'#a97c38',ok:'#97bb8c',warn:'#e5a35c',bad:'#dc6852',ink:'#f2e8d7',muted:'#ab9a82'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const hyp=Math.hypot,PI=Math.PI;
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise2(seed){const r=rng(seed),T=new Float32Array(65536);for(let i=0;i<65536;i++)T[i]=r();
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const X0=(xi&255)<<8,X1=((xi+1)&255)<<8,Y0=yi&255,Y1=(yi+1)&255;const a=T[X0|Y0],b=T[X1|Y0],c=T[X0|Y1],d=T[X1|Y1];
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}}
function fbm(n,x,y,o){let s=0,a=.5,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f,y*f);t+=a;a*=.5;f*=2.03}return s/t}
const hash1=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function polyPath(p,close=true){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);if(close)ctx.closePath();}

/* ================= view (mm -> logical px) ================= */
let V={s:1,cx:400,cy:0};
const toMm=(x,y,v=V)=>[(x-v.cx)/v.s,(y-v.cy)/v.s];
const toPx=(x,y,v=V)=>[v.cx+x*v.s,v.cy+y*v.s];
function withV(v,fn){ctx.save();ctx.translate(v.cx,v.cy);ctx.scale(v.s,v.s);fn();ctx.restore();}

/* ================= geometry: the cello outline (mm, body top centre = 0,0) ================= */
function crSample(pts,steps){const out=[],n=pts.length;for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
  for(let s=0;s<steps;s++){const t=s/steps,t2=t*t,t3=t2*t;const f=k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);out.push([f(0),f(1)]);}}
  out.push(pts[n-1].slice());return out;}
const SEG_UP=[[0,0],[50,2],[98,12],[136,33],[160,66],[171,108],[169,152],[158,194],[147,226],[146,250],[157,270]];
const SEG_C=[[157,270],[137,283],[122,309],[115,342],[113,372],[116,404],[124,436],[140,460],[165,473]];
const SEG_LO=[[165,473],[164,492],[178,517],[199,549],[215,586],[221,624],[215,664],[199,700],[173,729],[136,749],[76,760],[0,763]];
const RIB_UP=crSample(SEG_UP,8),RIB_C=crSample(SEG_C,8),RIB_LO=crSample(SEG_LO,8);
const RIGHT=RIB_UP.concat(RIB_C.slice(1),RIB_LO.slice(1));
const OUTLINE=RIGHT.concat(RIGHT.slice(1,-1).reverse().map(([x,y])=>[-x,y]));
const BODY_C=[0,381];
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return hyp(ax+t*dx-px,ay+t*dy-py);}
function polyDist(p,poly,closed){let m=1e9;const n=poly.length,L=closed?n:n-1;for(let i=0;i<L;i++){const a=poly[i],b=poly[(i+1)%n];const d=segDist(p[0],p[1],a[0],a[1],b[0],b[1]);if(d<m)m=d;}return m;}
function resample(poly,n,closed=true){const pts=closed?poly.concat([poly[0]]):poly;const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1],out=[];let j=0;for(let k=0;k<n;k++){const d=tot*k/(closed?n:n-1);while(j<L.length-2&&L[j+1]<d)j++;const t=(d-L[j])/((L[j+1]-L[j])||1);out.push([lerp(pts[j][0],pts[j+1][0],t),lerp(pts[j][1],pts[j+1][1],t)]);}return out;}
function arcLen(p){let s=0;for(let i=1;i<p.length;i++)s+=hyp(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s;}
const NSIGN=(()=>{let im=0;for(let i=0;i<OUTLINE.length;i++)if(OUTLINE[i][0]>OUTLINE[im][0])im=i;const n=OUTLINE.length,a=OUTLINE[(im-1+n)%n],b=OUTLINE[(im+1)%n];let tx=b[0]-a[0],ty=b[1]-a[1];const l=hyp(tx,ty);tx/=l;ty/=l;const p=OUTLINE[im];return inPoly(p[0]-ty*3,p[1]+tx*3,OUTLINE)?1:-1;})();

function genWood(kind,p,ppm,seed){
  const wMm=480,hMm=800,w=Math.round(wMm*ppm),h=Math.round(hMm*ppm);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
  const n=noise2(seed),n2=noise2(seed+101),half=Math.floor(w/2);
  for(let j=0;j<h;j++){const y=-20+(j+.5)/ppm;
    for(let i=half;i<w;i++){const ax=Math.abs((i+.5)/ppm-wMm/2);let r,gg,b;
      if(kind==='spruce'){
        const sp0=25.4/p.lpi,warp=(fbm(n,ax*.0025,y*.0018,3)-.5)*5*(1.7-p.even)+(n(ax*.05,y*.01)-.5)*.35*(1.6-p.even)+y*.004;
        const u=(ax*(1.22-.3*ax/240)+warp)/sp0,fl=Math.floor(u),ph=u-fl,ls=.55+.45*hash1(fl+seed);
        const dk=sstep(.58,.8,ph)*(1-sstep(.9,1,ph))*ls*.85;
        r=236-68*dk;gg=212-92*dk;b=163-97*dk;
        const s=n2(ax*.32,y*.035);if(s>.7){const k=(s-.7)*1.2;r+=k*40;gg+=k*34;b+=k*26;}
        if(p.knot){const kx=ax-104,ky=(y-380)*.62,kd=hyp(kx,ky);if(kd<26){const kk=Math.pow(1-kd/26,.7),ring=.5+.5*Math.sin(kd*1.3);r=lerp(r,92+ring*46,kk);gg=lerp(gg,56+ring*30,kk);b=lerp(b,30+ring*18,kk);}}
      }else{
        const warp=(fbm(n,ax*.01,y*.002,3)-.5)*8,u=(ax+warp)/1.6,ph=u-Math.floor(u);
        const dk=sstep(.75,.9,ph)*(1-sstep(.93,1,ph))*.22;
        const v=(y+ax*(.32+.2*fbm(n,ax*.004+4,y*.002,2))+(fbm(n2,ax*.006,y*.008,3)-.5)*44)/p.fw,f=Math.sin(v*6.2832),band=Math.sign(f)*Math.pow(Math.abs(f),.75);
        const amp=p.depth*(.35+.9*Math.pow(fbm(n,ax*.012+9,y*.004,3),1.5)),k=1+amp*band*.9;
        r=(232-30*dk)*k;gg=(204-42*dk)*k;b=(160-52*dk)*(k*.96+.04);
        if(p.crack){const cx=Math.abs(ax-80-5*Math.sin(y*.03));if(y>250&&y<470&&cx<Math.max(.8,.7/ppm)){r*=.35;gg*=.3;b*=.28;}}
      }
      const tone=.92+.1*fbm(n2,ax*.004+3,y*.003,2);r*=tone;gg*=tone;b*=tone;
      const o1=(j*w+i)*4,o2=(j*w+(w-1-i))*4;d[o1]=d[o2]=r;d[o1+1]=d[o2+1]=gg;d[o1+2]=d[o2+2]=b;d[o1+3]=d[o2+3]=255;}}
  g.putImageData(im,0,0);c.ppm=ppm;return c;}
function genBench(){const w=400,h=500,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data,n=noise2(77),n2=noise2(78);
  for(let j=0;j<h;j++){const pl=Math.floor(j/71),py=j-pl*71,pt=.82+.32*hash1(pl*7+3);
    for(let i=0;i<w;i++){const x=i+pl*913,warp=(fbm(n,x*.01,j*.03,3)-.5)*14,u=(j+warp)/2.4,ph=u-Math.floor(u),gr=sstep(.6,.85,ph)*(1-sstep(.9,1,ph));

      if(py<2){r*=.3;gg*=.3;b*=.3;}else if(py<4){r*=1.15;gg*=1.12;b*=1.1;}
      const o=(j*w+i)*4;d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255;}}

const AU={ctx:null,master:null,on:true};
function impulse(a,sec){const len=Math.floor(a.sampleRate*sec),b=a.createBuffer(2,len,a.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}return b;}
function audio(){if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AU.ctx=new C();}catch(e){return null;}
    const a=AU.ctx;AU.master=a.createGain();AU.master.gain.value=AU.on?.8:0;const cv2=a.createConvolver();cv2.buffer=impulse(a,2.6);const wet=a.createGain();wet.gain.value=.26;
    AU.master.connect(a.destination);AU.master.connect(cv2);cv2.connect(wet);wet.connect(a.destination);}
  if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}
let NB=null;function noiseBuf(a){if(NB)return NB;NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
const NZ={g:null,bp:null,lvl:0,cur:0,f:2000,q:1};
function noiseKick(l,f,q){NZ.lvl=Math.max(NZ.lvl,l);NZ.f=f;NZ.q=q||1;}
function noiseTick(){const a=AU.ctx;if(!a)return;if(!NZ.g){const s=a.createBufferSource();s.buffer=noiseBuf(a);s.loop=true;NZ.bp=a.createBiquadFilter();NZ.bp.type='bandpass';NZ.g=a.createGain();NZ.g.gain.value=0;s.connect(NZ.bp);NZ.bp.connect(NZ.g);NZ.g.connect(AU.master);s.start();}
  if(!NZ.lvl&&!NZ.cur)return;NZ.bp.frequency.setTargetAtTime(NZ.f,a.currentTime,.03);NZ.bp.Q.value=NZ.q;NZ.g.gain.setTargetAtTime(NZ.lvl,a.currentTime,.035);NZ.cur=NZ.lvl;NZ.lvl*=.78;if(NZ.lvl<.002)NZ.lvl=0;}

function click(gain=.25,freq=2400){const a=audio();if(!a)return;const s=a.createBufferSource();s.buffer=noiseBuf(a);const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=freq;const g=a.createGain();const t=a.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random());s.stop(t+.08);}

function pluck(freq,amp=.5){const a=audio();if(!a)return;const sr=a.sampleRate,N=Math.max(2,Math.round(sr/freq)),len=Math.floor(sr*2.4),buf=a.createBuffer(1,len,sr),d=buf.getChannelData(0),ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;let idx=0;for(let i=0;i<len;i++){const c=ring[idx],nx=ring[(idx+1)%N];ring[idx]=.4988*(c+nx);d[i]=c;idx=(idx+1)%N;}
  const s=a.createBufferSource();s.buffer=buf;s.playbackRate.value=freq*N/sr;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const g=a.createGain();g.gain.value=amp*.5;s.connect(lp);lp.connect(g);g.connect(AU.master);s.start();}
function makeVoice(freq){const a=audio();if(!a)return null;const t=a.currentTime;
  const o1=a.createOscillator(),o2=a.createOscillator(),o3=a.createOscillator();o1.type='sawtooth';o2.type='sawtooth';o3.type='triangle';o2.detune.value=5;o3.frequency.value=freq/2;

  const f3=a.createBiquadFilter();f3.type='peaking';f3.frequency.value=1650;f3.Q.value=1;f3.gain.value=-5;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2300;lp.Q.value=.5;
  const g=a.createGain();g.gain.value=0;
  const ns=a.createBufferSource();ns.buffer=noiseBuf(a);ns.loop=true;const nbp=a.createBiquadFilter();nbp.type='bandpass';nbp.frequency.value=freq*6;nbp.Q.value=2;const ng=a.createGain();ng.gain.value=.05;

const PARTS=[];
function spawn(o){if(REDUCED&&PARTS.length>40)return;PARTS.push(Object.assign({life:1,age:0,rot:0,vr:0,vx:0,vy:0,g:0,drag:.94},o));if(PARTS.length>300)PARTS.shift();}
function drawParticles(dt){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.age+=dt;if(p.age>p.life){PARTS.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=p.drag;p.vy*=p.drag;p.rot+=p.vr*dt;const a=1-p.age/p.life;
  ctx.save();ctx.globalAlpha=a*(p.alpha||1);ctx.translate(p.x,p.y);ctx.rotate(p.rot);p.draw(p,a);ctx.restore();}}
const drawShaving=(p)=>{ctx.strokeStyle=p.c;ctx.lineWidth=p.w||2.2;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,p.r,0,p.sweep);ctx.stroke();};

const drawSteam=(p,a)=>{const r=p.r*(1+(1-a)*1.8);const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(255,240,225,.22)');g.addColorStop(1,'rgba(255,240,225,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,PI*2);ctx.fill();};

let si=0,cur=null,uiFlag=false;

function reqUI(){uiFlag=true;invalidate();}
function overall(){let s=0,w=0;STEPS.forEach(st=>{if(G.scores[st.k]!=null){s+=G.scores[st.k]*st.w;w+=st.w;}});return w?Math.round(s/w):null;}
function grade(s){return s>=92?"Master's instrument":s>=82?'Concert grade':s>=70?'Conservatory grade':s>=55?'Student instrument':'Wall hanger';}
function renderRail(){$('#rail').innerHTML=STEPS.map((st,i)=>{const c=i<si?'done':i===si?'cur':'';const sc=G.scores[st.k];return`<li class="${c}" ${i===si?'aria-current="step"':''}><span class="n">${i<si?'✓':i+1}</span><span>${st.n}</span><span class="sc">${sc!=null?sc:''}</span></li>`;}).join('');
  $('#mStep').textContent=si+1;const o=overall();$('#mScore').textContent=o==null?'—':o;
  const li=$('#rail').children[si];if(li&&li.scrollIntoView&&window.innerWidth<980)li.scrollIntoView({block:'nearest',inline:'center'});}
function renderPanel(){$('#eyebrow').textContent=`Step ${si+1} of 12 · ${STEPS[si].n}`;$('#stTitle').textContent=cur.title;$('#stLead').textContent=cur.lead;$('#stHow').innerHTML=cur.how.map(h=>`<li>${h}</li>`).join('');
  $('#extra').innerHTML=cur.extra?cur.extra():'';cur.bind&&cur.bind();$('#toast').textContent='';setNext(false,cur.nextLabel||'Continue');reqUI();}
let go=function(i){si=i;cur=STAGES[i];P.down=false;PARTS.length=0;cur.enter();renderPanel();renderRail();};
function next(){if(cur.onNext&&cur.onNext()===false)return;if(cur.finish){const sc=cur.finish();if(sc!=null)G.scores[STEPS[si].k]=Math.round(clamp(sc,0,100));}chime();if(si<STAGES.length-1)go(si+1);}

/* pointer */
const P={x:0,y:0,down:false,inside:false};
function evPos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{audio();try{cv.setPointerCapture(e.pointerId);}catch(_){}const[x,y]=evPos(e);P.x=x;P.y=y;P.down=true;P.inside=true;cur.down&&cur.down(x,y);invalidate();e.preventDefault();});

      ctx.font=`24px ${F_D}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=s.tuned?COL.ok:COL.ink;ctx.fillText(STR[t.i].n,t.x+t.w/2,t.y+t.h/2);if(s.tuned){ctx.beginPath();ctx.arc(t.x+t.w-12,t.y+12,4,0,PI*2);ctx.fillStyle=COL.ok;ctx.fill();}ctx.restore();}
    const cx=600,cy=420,R=150,s=this.st[this.sel],n=this.needle,ok=Math.abs(s.c)<3;
    ctx.save();ctx.lineCap='round';for(let c=-50;c<=50;c+=5){const a=-PI/2+c/50*(PI*.38);const big=c%25===0;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(R-(big?20:10)),cy+Math.sin(a)*(R-(big?20:10)));ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.strokeStyle=c===0?COL.ok:'rgba(242,232,215,.45)';ctx.lineWidth=big?2:1;ctx.stroke();}
    ctx.beginPath();ctx.arc(cx,cy,R+10,-PI/2-.04,-PI/2+.04);ctx.strokeStyle=COL.ok;ctx.lineWidth=6;ctx.stroke();
    ctx.font=`500 11px ${F_M}`;ctx.fillStyle=COL.muted;ctx.textAlign='center';ctx.fillText('−50',cx+Math.cos(-PI/2-PI*.38)*(R+18),cy+Math.sin(-PI/2-PI*.38)*(R+18));ctx.fillText('+50',cx+Math.cos(-PI/2+PI*.38)*(R+18),cy+Math.sin(-PI/2+PI*.38)*(R+18));
    const a=-PI/2+clamp(n,-55,55)/50*(PI*.38);ctx.strokeStyle=ok?COL.ok:Math.abs(s.c)>50?COL.bad:COL.warn;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-8),cy+Math.sin(a)*(R-8));ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,7,0,PI*2);ctx.fillStyle=COL.ink;ctx.fill();
    const f=this.freq(this.sel);ctx.font=`44px ${F_D}`;ctx.fillStyle=ok?COL.ok:COL.ink;ctx.fillText(noteName(f),cx,cy+62);ctx.font=`500 14px ${F_M}`;ctx.fillStyle=COL.muted;ctx.fillText(`${f.toFixed(1)} Hz · ${s.c>=0?'+':''}${Math.round(s.c)} cents`,cx,cy+90);
    ctx.fillText(`target ${STR[this.sel].n}${STR[this.sel].oct} · ${STR[this.sel].f.toFixed(1)} Hz`,cx,cy+112);ctx.restore();
    this.knob(this.K.peg,s.pa,'Peg','DRAG UP / DOWN',this.drag&&this.drag.k==='peg');this.knob(this.K.fine,s.fa,'Fine tuner','SMALL STEPS',this.drag&&this.drag.k==='fine');
    for(const[x,lab]of[[432,'Pluck string'],[612,'Hear target']]){ctx.save();rr(x,826,168,48,24);ctx.fillStyle='rgba(255,255,255,.04)';ctx.fill();ctx.strokeStyle='rgba(214,168,92,.45)';ctx.stroke();ctx.font=`500 14px ${F_B}`;ctx.fillStyle=COL.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,x+84,851);ctx.restore();}},
  ui(){setRead(STR.map((q,i)=>{const s=this.st[i];return[`${q.n} string`,s.tuned?'In tune':`${s.c>=0?'+':''}${Math.round(s.c)} c`,s.tuned?'ok':Math.abs(s.c)<50?'warn':''];}).concat([['Snapped',String(this.st.reduce((a,s)=>a+s.snaps,0)),this.st.some(s=>s.snaps)?'bad':'']]));setNext(this.st.every(s=>s.tuned));},
  finish(){this.cleanup();const sn=this.st.reduce((a,s)=>a+s.snaps,0),res=this.st.reduce((a,s)=>a+Math.abs(s.c),0)/4;return 100-sn*10-res*3;}};

/* ================= STAGE 12: play + label ================= */
const S_PLAY={title:'Play and sign',lead:'Your cello is finished. Draw the bow between the fingerboard and the bridge, or press the fingerboard to stop a note.',
  how:['Bow: press and move in the band just above the bridge. Faster strokes play louder.','Notes: press on the fingerboard along a string and slide for a glissando.','Keys 1 to 4 play the open strings C, G, D, A.'],
  enter(){prepWood();V={s:.72,cx:400,cy:368};if(!G.varnish)G.varnish={rgb:VARNISH[0].rgb,coats:3,name:VARNISH[0].name};if(!G.fit||!G.fit.bridge)G.fit={fingerboard:true,nut:true,pegs:[1,1,1,1],tailpiece:true,endpin:true,bridge:[0,BRIDGE_Y],post:[24,BRIDGE_Y+12]};G.strung=[1,1,1,1];
    this.vib=[0,0,0,0];this.stops=[0,0,0,0];this.mode=null;this.voice=null;this.amp=0;this.tAmp=0;this.note='';this.keys={};this.lastMove=0;},
  cleanup(){if(this.voice){this.voice.stop();this.voice=null;}this.mode=null;this.keys={};},
  busy(){return !!this.mode||this.vib.some(v=>v>0);},
  extra(){const o=overall()??0;const rows=STEPS.slice(0,11).map(s=>`<tr><td>${s.n}</td><td>${G.scores[s.k]!=null?G.scores[s.k]:'—'}</td></tr>`).join('');
    return `<div class="grade"><b>${grade(o)}</b><span>${o}</span></div>
<div class="field"><label for="maker">Maker's name for the label</label><input id="maker" maxlength="32" autocomplete="off" placeholder="Your name" value="${(G.maker||'').replace(/"/g,'&quot;')}"></div>
<div class="label-card" aria-label="Label inside the cello"><div class="l1" id="lblName">${G.maker?esc(G.maker):'Your name'} fecit</div><div class="l2">Anno 2026 · Violoncello</div></div>
<p class="fine">Top: ${esc(G.woodTop.name)}, ${G.woodTop.lpi} lines/in · Back: ${esc(G.woodBack.name)} · Varnish: ${esc(G.varnish.name||'')}, 3 coats · String length ${STR_L} mm</p>
<table class="tbl" aria-label="Scores by step"><tbody>${rows}</tbody></table>
<button class="btn" id="btnAgain" type="button">Build another cello</button>`;},
  bind(){const i=$('#maker');i&&i.addEventListener('input',()=>{G.maker=i.value.trim();$('#lblName').textContent=`${G.maker||'Your name'} fecit`;invalidate();save();});
    const b=$('#btnAgain');b&&b.addEventListener('click',()=>{this.cleanup();G.scores={};G.varnish=null;G.fit=null;G.strung=[0,0,0,0];go(0);});},
  strX(i,y){const s=STR[i];return lerp(s.nx,s.bx,clamp((y-NUT_Y)/STR_L,0,1));},
  nearest(m){let b=-1,bd=1e9;for(let i=0;i<4;i++){const d=Math.abs(m[0]-this.strX(i,m[1]));if(d<bd){bd=d;b=i;}}return[b,bd];},
  start(i,f,kind){this.cleanup();this.voice=makeVoice(f);this.mode={i,kind};this.vib=this.vib.map((v,k)=>k===i?v:0);if(this.voice){this.voice.setAmp(kind==='finger'?.6:.15,.08);setTimeout(()=>this.voice&&this.voice.vibrato(.0045),350);}this.note=`${noteName(f)} · ${f.toFixed(1)} Hz`;},
  down(x,y){const m=toMm(x,y);
    if(m[1]>-280&&m[1]<292){const[i,d]=this.nearest(m);if(d<12){const dd=clamp(m[1]-NUT_Y,0,560);const f=STR[i].f*STR_L/(STR_L-dd);this.stops=[0,0,0,0];this.stops[i]=m[1];this.start(i,f,'finger');this.tAmp=.6;return;}}
    if(m[1]>=300&&m[1]<392&&Math.abs(m[0])<64){const[i]=this.nearest(m);this.stops=[0,0,0,0];this.start(i,STR[i].f,'bow');this.tAmp=.12;this.bow=[x,y];}},
  move(x,y,dx,dy){if(!this.mode||!P.down)return;const m=toMm(x,y);
    if(this.mode.kind==='finger'){const i=this.mode.i,dd=clamp(m[1]-NUT_Y,0,560);const f=STR[i].f*STR_L/(STR_L-dd);this.stops[i]=clamp(m[1],NUT_Y,NUT_Y+560);if(this.voice)this.voice.setFreq(f,.03);this.note=`${noteName(f)} · ${f.toFixed(1)} Hz`;}
    else{const sp=hyp(dx,dy);this.tAmp=clamp(.1+sp*.035,.1,.85);this.bow=[x,y];this.lastMove=performance.now();}},
  up(){this.cleanup();this.mode=null;this.stops=[0,0,0,0];this.bow=null;},
  key(e,dn){const k='1234'.indexOf(e.key);if(k<0)return;if(dn&&!this.keys[k]){this.keys[k]=true;this.start(k,STR[k].f,'key');this.tAmp=.55;}else if(!dn){this.keys[k]=false;if(this.mode&&this.mode.i===k){this.cleanup();this.mode=null;}}},
  update(dt){if(this.mode&&this.mode.kind==='bow'&&performance.now()-this.lastMove>120)this.tAmp=Math.max(.06,this.tAmp-dt*1.5);
    if(this.mode&&this.voice){this.amp=lerp(this.amp,this.tAmp,Math.min(1,dt*10));this.voice.setAmp(this.amp,.04);this.vib[this.mode.i]=Math.max(this.vib[this.mode.i],this.amp*1.4);}
    for(let i=0;i<4;i++)if(!this.mode||this.mode.i!==i)this.vib[i]=Math.max(0,this.vib[i]-dt*2);},
  draw(){tag(G.maker?`${G.maker} fecit · Anno 2026`:'Violoncello · Anno 2026');drawCello(V,{strings:G.strung,vib:this.vib,stops:this.stops});
    const a=toPx(-64,300),b=toPx(64,392);ctx.save();ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(214,168,92,.35)';ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.restore();
    if(this.bow){const[x,y]=this.bow;ctx.save();ctx.lineCap='round';ctx.strokeStyle='#3b2416';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-230,y-6);ctx.lineTo(x+230,y-6);ctx.stroke();ctx.strokeStyle='rgba(245,240,228,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-226,y);ctx.lineTo(x+222,y);ctx.stroke();
      ctx.fillStyle='#1b120c';rr(x-240,y-10,26,14,3);ctx.fill();ctx.restore();}
    if(this.mode&&this.mode.kind==='finger'){const i=this.mode.i,y=this.stops[i];const[px,py]=toPx(this.strX(i,y),y);ctx.beginPath();ctx.arc(px,py,9,0,PI*2);ctx.fillStyle='rgba(242,232,215,.35)';ctx.fill();ring(px,py,9,'rgba(242,232,215,.9)');}
    ctx.save();ctx.textAlign='left';ctx.font=`28px ${F_D}`;ctx.fillStyle=this.mode?COL.ink:'rgba(242,232,215,.4)';ctx.fillText(this.mode?this.note.split(' · ')[0]:'—',610,92);ctx.font=`500 12px ${F_M}`;ctx.fillStyle=COL.muted;ctx.fillText(this.mode?this.note.split(' · ')[1]:'press to play',610,114);
    ctx.font=`500 11px ${F_M}`;ctx.fillStyle='rgba(214,168,92,.75)';ctx.textAlign='right';ctx.fillText('BOW HERE',a[0]-10,(a[1]+b[1])/2+4);ctx.fillText('FINGERBOARD →',toPx(-30,-140)[0]-6,toPx(0,-140)[1]);ctx.restore();},
  ui(){setRead([]);setNext(false,'Finished');}};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ================= wiring ================= */
const STEPS=[{k:'wood',n:'Tonewood',w:10},{k:'cut',n:'Cut the plates',w:10},{k:'carve',n:'Carve the top',w:12},{k:'fh',n:'F-holes',w:8},{k:'ribs',n:'Bend the ribs',w:8},{k:'box',n:'Close the box',w:8},{k:'neck',n:'Set the neck',w:10},{k:'varn',n:'Varnish',w:10},{k:'fit',n:'Fittings',w:8},{k:'str',n:'Strings',w:4},{k:'tune',n:'Tune',w:12},{k:'play',n:'Play & sign',w:0}];
const STAGES=[S_WOOD,S_CUT,S_CARVE,S_FH,S_RIBS,S_BOX,S_NECK,S_VARN,S_FIT,S_STR,S_TUNE,S_PLAY];

let frames=0;
function frame(t){rafId=0;if(hidden)return;const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  try{cur.update&&cur.update(dt);
    const busy=P.down||PARTS.length>0||NZ.lvl>0||NZ.cur>0||!!(cur.busy&&cur.busy());
    if(dirty||busy){dirty=false;frames++;ctx.setTransform(CS,0,0,CS,0,0);ctx.clearRect(0,0,W,H);drawBench();cur.draw();drawParticles(dt);}
    if(uiFlag){uiFlag=false;cur.ui&&cur.ui();}noiseTick();
    if(busy||dirty)rafId=requestAnimationFrame(frame);}
  catch(e){console.error(e);window.__lbErr&&window.__lbErr();}}

/* ================= save / continue (localStorage, every access guarded) ================= */
const SAVE_KEY='luthiers-bench:save:v1';
const store={get(){try{const v=window.localStorage.getItem(SAVE_KEY);return v?JSON.parse(v):null;}catch(e){return null;}},
  set(d){try{window.localStorage.setItem(SAVE_KEY,JSON.stringify(d));}catch(e){}},
  clear(){try{window.localStorage.removeItem(SAVE_KEY);}catch(e){}}};
function snapshot(){return{v:1,si,scores:G.scores,top:G.woodTop&&G.woodTop.id,back:G.woodBack&&G.woodBack.id,varnish:G.varnish,maker:G.maker,fit:G.fit,strung:G.strung};}
let pendingResume=false;
function save(){if(!running||pendingResume)return;if(si>0)store.set(snapshot());else store.clear();}
function restore(d){G.scores=d.scores&&typeof d.scores==='object'?d.scores:{};G.woodTop=WOODS.spruce.find(w=>w.id===d.top)||null;G.woodBack=WOODS.maple.find(w=>w.id===d.back)||null;
  G.varnish=d.varnish&&Array.isArray(d.varnish.rgb)?d.varnish:null;G.maker=typeof d.maker==='string'?d.maker.slice(0,32):'';if(d.fit&&typeof d.fit==='object')G.fit=d.fit;if(Array.isArray(d.strung))G.strung=d.strung;
  prepWood();go(clamp(d.si|0,0,STAGES.length-1));}
function offerResume(d){const box=$('#resume');if(!box)return;const n=clamp(d.si|0,1,STAGES.length-1);pendingResume=true;
  $('#resumeStep').textContent=`Step ${n+1} of 12 · ${STEPS[n].n}`;box.hidden=false;
  const close=()=>{box.hidden=true;pendingResume=false;document.removeEventListener('keydown',esc2);};
  const esc2=e=>{if(e.key==='Escape'){close();store.clear();}};document.addEventListener('keydown',esc2);
  $('#btnResume').onclick=()=>{close();try{restore(d);}catch(e){console.error(e);store.clear();go(0);}};
  $('#btnFresh').onclick=()=>{close();store.clear();};
  $('#btnResume').focus();}
const _go=go;go=function(i){_go(i);save();};

/* pause loop + audio while the tab is hidden */
document.addEventListener('visibilitychange',()=>{hidden=!!document.hidden;
  if(hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0;}
    if(P.down){P.down=false;try{cur.up&&cur.up(P.x,P.y);}catch(e){}}try{cur.cleanup&&cur.cleanup();}catch(e){}
    save();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{});}
  else{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});invalidate();}});
window.addEventListener('pagehide',save);
/* canvas text uses the web fonts: redraw cached layers once they are in */
if(document.fonts&&document.fonts.load)Promise.all(['400 12px "Marcellus"','400 12px "IBM Plex Mono"','500 12px "IBM Plex Mono"','400 12px "Instrument Sans"','500 12px "Instrument Sans"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>{dropCaches();invalidate();});

function start(data){running=true;
  if(data&&data.si>0)restore(data);
  else{const sv=store.get();_go(0);if(sv&&sv.si>0)offerResume(sv);}
  invalidate();}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(snapshot);}catch(e){}}
window.__lb={go:i=>{prepWood();go(i);},G,get cur(){return cur;},V:()=>V,geo:{CUT_S,GLUE_S,CLAMP_S,FH,PEGS,STR},get frames(){return frames;},save,store};
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
